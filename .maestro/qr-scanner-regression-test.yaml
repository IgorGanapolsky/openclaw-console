appId: com.openclaw.console
---
# Comprehensive QR Scanner Button Regression Test
# This test would have caught the "button click does nothing" issue

- launchApp

# Navigate to Gateway Connection screen
- tapOn:
    text: "Connect Gateway|Gateway Connection|Enhanced QR Scanner"
    optional: true

# Wait for the Gateway Connection screen to load
- assertVisible:
    text: "Enhanced QR Scanner"

# Test the QR Scanner button click functionality
- tapOn: "Enhanced QR Scanner"

# Verify that clicking the button produces some response
# In debug build: should show "DEBUG: QR Scanner" dialog
# In production: should show QR scanner or some UI feedback
- assertVisible:
    text: "DEBUG: QR Scanner|QR Scanner|Camera|Cancel|Close"

# If debug dialog appears, test the connection success button
- tapOn:
    text: "Test Connection Success"
    optional: true

# Verify connection callback works
- assertVisible:
    text: "Connected|Success|Gateway"
    optional: true

# Test manual URL input as fallback
- tapOn: "Enter Gateway URL Manually"
- assertVisible: "Gateway URL"

# Test URL input field
- tapOn:
    id: "manual-url-input"
- inputText: "http://192.168.1.100:18789"

# Verify Connect button becomes enabled
- assertVisible:
    text: "Connect"
    enabled: true

# Test QR Code Generator
- tapOn: "Generate QR Code"
- assertVisible: "Generate Your Own QR Code"

# Test QR generator URL input
- tapOn:
    id: "qr-generator-url-input"
- inputText: "http://192.168.1.100:18789"

# Verify QR code is generated and displayed
- assertVisible:
    id: "generated-qr-code"

# Test troubleshooting dialog
- tapOn: "Connection Troubleshooting"
- assertVisible: "Network Troubleshooting"
- tapOn: "Close"

# This E2E test covers:
# ✅ QR Scanner button click response (catches the regression!)
# ✅ Manual URL input functionality
# ✅ QR Code generator
# ✅ Troubleshooting dialog
# ✅ All major user interaction flows that could break
