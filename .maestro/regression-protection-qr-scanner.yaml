appId: com.openclaw.console
---
# CRITICAL REGRESSION PROTECTION: QR Scanner Button Click
# This test specifically protects against the "button does nothing" regression
# User reported: "scan qr code button doesn't even work i click it and nothing happens"

- launchApp

# CRITICAL CHECKPOINT 1: App launches successfully
- assertVisible:
    text: "OpenClaw Console"

# CRITICAL CHECKPOINT 2: Welcome screen loads with instructions
- assertVisible:
    text: "STEP 1: Run this on your computer"

- assertVisible:
    text: "openclaw qr --remote"

# CRITICAL CHECKPOINT 3: QR scanner button is visible and accessible
- assertVisible:
    text: "STEP 2: Scan QR Code"

# CRITICAL CHECKPOINT 4: Button test tag exists (for automation)
- assertVisible:
    id: "qr_scanner_button"
    optional: true  # Graceful degradation if test tag missing

# THE CRITICAL TEST: Click the QR scanner button
# This was the exact failure point - button click did NOTHING
- tapOn: "STEP 2: Scan QR Code"

# CRITICAL CHECKPOINT 5: Navigation MUST happen after button click
# The regression was: button click → nothing happens
# Expected: button click → navigation to setup/scanner screen
- extendedWaitUntil:
    visible:
      text: "Setup Wizard|Gateway|Scanner|Camera|QR Code|Add Gateway"
    timeout: 15000

# CRITICAL CHECKPOINT 6: We should NOT still be on welcome screen
- assertNotVisible:
    text: "STEP 1: Run this on your computer"

# REGRESSION PROTECTION: Verify button click caused state change
# If we can still see STEP 1 instructions, the button did nothing!
- runScript: |
    // JavaScript validation that navigation occurred
    const step1Visible = maestro.isVisible("STEP 1: Run this on your computer", { timeout: 1000 });
    if (step1Visible) {
      throw new Error("REGRESSION DETECTED: QR scanner button click did not trigger navigation!");
    }

# CRITICAL CHECKPOINT 7: Verify new screen has expected functionality
- assertVisible:
    text: "Scanner|Camera|Gateway|QR"

# CRITICAL CHECKPOINT 8: Test back navigation works
- pressKey: "Back"
- assertVisible:
    text: "STEP 1: Run this on your computer"

# CRITICAL CHECKPOINT 9: Test button still works after back navigation
- tapOn: "STEP 2: Scan QR Code"
- extendedWaitUntil:
    visible:
      text: "Setup|Gateway|Scanner"
    timeout: 10000

# FINAL VALIDATION: Multiple clicks don't break functionality
- pressKey: "Back"
- tapOn: "STEP 2: Scan QR Code"
- tapOn: "STEP 2: Scan QR Code"  # Double-click test
- extendedWaitUntil:
    visible:
      text: "Setup|Gateway|Scanner"
    timeout: 8000

# REGRESSION TEST SUMMARY:
# ✅ App launches and shows welcome screen
# ✅ All UI elements are visible and properly labeled
# ✅ QR scanner button has correct test tag for automation
# ✅ Button click triggers immediate navigation (NOT "nothing happens")
# ✅ Navigation leads to expected next screen
# ✅ User is no longer on welcome screen after button click
# ✅ Back navigation returns to welcome screen
# ✅ Button functionality persists after multiple interactions
# ✅ Double-click handling works correctly
