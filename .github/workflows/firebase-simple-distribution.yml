name: Firebase App Distribution (Simple)

# Simplified Firebase App Distribution based on Random-Timer's proven pattern
# Just builds and distributes - no complex testing

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (empty = current branch)"
        required: false
        type: string

concurrency:
  group: firebase-simple-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distribute:
    name: Build and Distribute to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Validate Firebase secrets
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_ANDROID_APP_ID GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing secret: $name"
              exit 1
            fi
          done
          echo "✅ All Firebase secrets present"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Create google-services.json
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          echo "🏗️ Building OpenClaw Console release APK..."
          ./gradlew assembleRelease --no-daemon

          echo "✅ APK built successfully:"
          ls -la app/build/outputs/apk/release/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_REQUIRED_TESTER_EMAIL: ${{ vars.FIREBASE_REQUIRED_TESTER_EMAIL }}
        run: |
          set -euo pipefail

          # Setup Firebase authentication
          CREDENTIALS_FILE="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"

          # Get project ID from google-services.json if not set
          RESOLVED_PROJECT_ID="${FIREBASE_PROJECT_ID:-}"
          if [ -z "$RESOLVED_PROJECT_ID" ]; then
            RESOLVED_PROJECT_ID="$(jq -r '.project_info.project_id // empty' android/app/google-services.json)"
          fi

          if [ -z "$RESOLVED_PROJECT_ID" ]; then
            echo "❌ Could not resolve Firebase project ID"
            exit 1
          fi

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          echo "🚀 Distributing to Firebase App Distribution..."
          echo "📱 Project: $RESOLVED_PROJECT_ID"
          echo "🎯 App ID: $FIREBASE_ANDROID_APP_ID"
          echo "📦 APK: $APK_PATH"

          # Build Firebase command
          DIST_CMD=(
            firebase appdistribution:distribute
            "$APK_PATH"
            --app "$FIREBASE_ANDROID_APP_ID"
            --project "$RESOLVED_PROJECT_ID"
            --release-notes "OpenClaw Console hotfix - fixes app startup crash (Build $(date +%Y%m%d-%H%M))"
          )

          # Add tester if configured
          if [ -n "${FIREBASE_REQUIRED_TESTER_EMAIL:-}" ]; then
            DIST_CMD+=(--testers "$FIREBASE_REQUIRED_TESTER_EMAIL")
          fi

          # Execute Firebase distribution
          "${DIST_CMD[@]}"

          echo "✅ Firebase App Distribution completed successfully!"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-console-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore
          rm -f "${RUNNER_TEMP}/firebase-sa.json" 2>/dev/null || true