name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-changes:
    name: Detect iOS Changes
    runs-on: ubuntu-latest
    outputs:
      ios_changed: ${{ steps.changed.outputs.ios_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE="$BEFORE_SHA"
            HEAD="$GITHUB_SHA"
          else
            BASE="HEAD^"
            HEAD="HEAD"
          fi

          git diff --name-only "$BASE" "$HEAD" > changed-files.txt || git show --name-only --format= "$HEAD" > changed-files.txt
          if grep -Eq '^(ios/|Package\.swift$|Package\.resolved$)' changed-files.txt; then
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
            echo "iOS changes detected"
          else
            echo "ios_changed=false" >> "$GITHUB_OUTPUT"
            echo "No iOS changes detected"
          fi

  android-agent-guardrails:
    name: Android Agent Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Android CLI bootstrap path
        run: python3 scripts/check_android_cli.py --allow-missing-tools

      - name: Verify Android agent workflow guardrails
        run: python3 scripts/check_android_agent_guardrails.py

  flaky-test-guardrails:
    name: Flaky Test Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate flaky test quarantine manifest
        run: python3 scripts/check_flaky_quarantine.py

  icon-parity:
    name: App Icon Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Verify canonical icon sync
        run: python3 scripts/sync_app_icons.py --check

  release-contract:
    name: Release Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Validate release contract
        run: python3 scripts/validate_release_contract.py --platform both

  brand-parity:
    name: Brand Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Android/iOS icon parity
        run: ./scripts/check-brand-parity.sh

  lint-kotlin:
    name: Architecture Lint (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Architecture ban checks
        run: |
          ERRORS=0
          while IFS= read -r f; do
            if grep -n 'AndroidViewModel' "$f" | grep -v '// allow-android-viewmodel' > /dev/null 2>&1; then
              echo ":: $f: Uses AndroidViewModel (use ViewModel instead)"
              ERRORS=$((ERRORS + 1))
            fi
            if grep -n '\.collectAsState()' "$f" > /dev/null 2>&1; then
              echo ":: $f: Uses .collectAsState() instead of .collectAsStateWithLifecycle()"
              ERRORS=$((ERRORS + 1))
            fi
            if grep -n '!!' "$f" | grep -v '// allow-nonnull' > /dev/null 2>&1; then
              echo ":: $f: Uses !! non-null assertion without justification"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find android -name '*.kt' -not -path '*/build/*')
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS architecture violation(s)"
            exit 1
          fi
          echo "No architecture violations found"

  lint-swift:
    name: Architecture Lint (Swift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Architecture ban checks
        run: |
          ERRORS=0
          while IFS= read -r f; do
            if grep -n 'force_cast\|as!' "$f" | grep -v '// allow-force-cast' > /dev/null 2>&1; then
              echo ":: $f: Uses force cast (as!) without justification"
              ERRORS=$((ERRORS + 1))
            fi
            if grep -n 'http://' "$f" | grep -v 'localhost\|127.0.0.1\|// allow-http' > /dev/null 2>&1; then
              echo ":: $f: Uses plain HTTP URL (use HTTPS)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find ios -name '*.swift')
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS architecture violation(s)"
            exit 1
          fi
          echo "No architecture violations found"

  skills-test:
    name: Skills Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "openclaw-skills/package-lock.json"

      - name: Install dependencies
        working-directory: openclaw-skills
        run: npm ci

      - name: Lint
        working-directory: openclaw-skills
        run: npx eslint src/ tests/ --max-warnings 0

      - name: Type check
        working-directory: openclaw-skills
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: openclaw-skills
        run: npm test

  android-build:
    name: Android Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Verify brand parity
        run: ./scripts/check-brand-parity.sh

      - name: Build and validate Android app
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  ios-build:
    name: iOS Build Check
    needs: [ios-changes]
    runs-on: ${{ needs.ios-changes.outputs.ios_changed == 'true' && 'macos-14' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip iOS build when no iOS files changed
        if: needs.ios-changes.outputs.ios_changed != 'true'
        run: echo "No iOS files changed; skipping macOS simulator build."

      - name: Select Xcode
        if: needs.ios-changes.outputs.ios_changed == 'true'
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Resolve and build for simulator
        if: needs.ios-changes.outputs.ios_changed == 'true'
        working-directory: ios/OpenClawConsole
        run: |
          # Resolve SPM packages first with explicit derivedDataPath
          xcodebuild -resolvePackageDependencies \
            -scheme OpenClawConsole \
            -derivedDataPath .build/DerivedData

          # Build with the same derivedDataPath and disable auto-resolution
          xcodebuild build \
            -scheme OpenClawConsole \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
