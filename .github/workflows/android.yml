name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/OpenClawConsole/OpenClawConsole/Assets.xcassets/AppIcon.appiconset/**'
      - 'scripts/check-brand-parity.sh'
      - 'scripts/sync-android-launcher-icon.sh'
      - 'scripts/android-launcher-icon.manifest'
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - 'ios/OpenClawConsole/OpenClawConsole/Assets.xcassets/AppIcon.appiconset/**'
      - 'scripts/check-brand-parity.sh'
      - 'scripts/sync-android-launcher-icon.sh'
      - 'scripts/android-launcher-icon.manifest'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify brand parity
        run: ../scripts/check-brand-parity.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: android/app/build/reports/tests/

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify brand parity
        run: ../scripts/check-brand-parity.sh

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-debug.html
