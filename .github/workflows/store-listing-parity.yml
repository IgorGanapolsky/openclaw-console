name: Store Listing Parity

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "android/fastlane/metadata/**"
      - "ios/OpenClawConsole/fastlane/metadata/**"
      - "PRIVACY_POLICY.md"
  push:
    branches: [develop]
    paths:
      - "android/fastlane/metadata/**"
      - "ios/OpenClawConsole/fastlane/metadata/**"
      - "PRIVACY_POLICY.md"

jobs:
  check-metadata:
    name: Store Listing Parity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Validate release contract
        run: python3 scripts/validate_release_contract.py --platform both
