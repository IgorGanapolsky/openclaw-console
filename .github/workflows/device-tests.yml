name: Device Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: device-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  device-test-changes:
    name: Detect Device Test Changes
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.changed.outputs.android_changed }}
      ios_changed: ${{ steps.changed.outputs.ios_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
            echo "Full run: running both platform device suites."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE="$BEFORE_SHA"
            HEAD="$GITHUB_SHA"
          else
            BASE="HEAD^"
            HEAD="HEAD"
          fi

          git diff --name-only "$BASE" "$HEAD" > changed-files.txt || git show --name-only --format= "$HEAD" > changed-files.txt

          android_changed=false
          ios_changed=false
          if grep -Eq '^(android/|\.maestro/|scripts/device-tests/|scripts/ci/run-with-retry\.sh|docs/testing/|scripts/check_mobile_test_coverage\.py|\.github/workflows/device-tests\.yml)' changed-files.txt; then
            android_changed=true
          fi
          if grep -Eq '^(ios/|\.maestro/|docs/testing/|scripts/check_mobile_test_coverage\.py|\.github/workflows/device-tests\.yml)' changed-files.txt; then
            ios_changed=true
          fi

          echo "android_changed=$android_changed" >> "$GITHUB_OUTPUT"
          echo "ios_changed=$ios_changed" >> "$GITHUB_OUTPUT"
          echo "Android device tests: $android_changed"
          echo "iOS device tests: $ios_changed"

  android-device-tests:
    name: Android Emulator + Maestro Tests
    needs: [device-test-changes]
    if: needs.device-test-changes.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Create dummy google-services.json for CI
        working-directory: android
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'GSEOF'
            {
              "project_info": {
                "project_number": "000000000000",
                "project_id": "openclaw-console-ci",
                "storage_bucket": "openclaw-console-ci.appspot.com"
              },
              "client": [{
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.openclaw.console"
                  }
                },
                "api_key": [{ "current_key": "CI_PLACEHOLDER" }]
              }],
              "configuration_version": "1"
            }
          GSEOF
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-30-openclaw-${{ runner.os }}

      - name: Run Maestro tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI_RETRY_ATTEMPTS: "2"
          CI_RETRY_DELAY_SECONDS: "15"
          CI_RETRY_LOG_DIR: ${{ runner.temp }}/openclaw-ci-retry
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: scripts/ci/run-with-retry.sh --label android-maestro -- sh scripts/device-tests/ci-maestro.sh

      - name: Upload Android device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: android-device-diagnostics
          path: |
            ${{ runner.temp }}/openclaw-ci-retry/
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
          if-no-files-found: ignore

  ios-device-tests:
    name: iOS Simulator Tests
    needs: [device-test-changes]
    if: needs.device-test-changes.outputs.ios_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: List available simulators
        id: simulator
        run: |
          xcrun simctl list devices available | grep iPhone
          SIMULATOR_ID=$(xcrun simctl list devices available | awk '/iPhone/ { if (match($0, /\([0-9A-F-]+\)/)) { print substr($0, RSTART + 1, RLENGTH - 2); exit } }')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          DESTINATION="platform=iOS Simulator,id=$SIMULATOR_ID"
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
          echo "Using destination: $DESTINATION"

      - name: Resolve SPM dependencies
        working-directory: ios/OpenClawConsole
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme OpenClawConsole \
            -derivedDataPath .build/DerivedData

      - name: Build and test iOS app
        working-directory: ios/OpenClawConsole
        run: |
          # Build for simulator
          xcodebuild build \
            -scheme OpenClawConsole \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          set -o pipefail
          xcodebuild test \
            -scheme OpenClawConsole \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcode-test.log

          if grep -q "not currently configured for the test action" /tmp/xcode-test.log; then
            echo "OpenClawConsole scheme has no test action configured."
            exit 1
          fi

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro tests (if available)
        env:
          CI_RETRY_ATTEMPTS: "2"
          CI_RETRY_DELAY_SECONDS: "15"
          CI_RETRY_LOG_DIR: ${{ runner.temp }}/openclaw-ci-retry
        run: |
          IOS_FLOWS=()
          while IFS= read -r flow; do
            IOS_FLOWS+=("$flow")
          done < <(find .maestro -maxdepth 1 -type f \( -name '*ios*.yaml' -o -name 'smoke-test-ios.yaml' \) 2>/dev/null | sort)
          if [ "${#IOS_FLOWS[@]}" -gt 0 ]; then
            printf 'Running iOS Maestro tests:\n'
            printf ' - %s\n' "${IOS_FLOWS[@]}"
            set +e
            scripts/ci/run-with-retry.sh --label ios-maestro -- maestro test "${IOS_FLOWS[@]}" 2>&1 | tee /tmp/maestro-ios.log
            maestro_exit=${PIPESTATUS[0]}
            set -e

            if [ "$maestro_exit" -ne 0 ]; then
              if grep -q "Not enough devices connected" /tmp/maestro-ios.log; then
                echo "No Maestro-compatible iOS device detected in CI; skipping iOS Maestro tests."
              else
                exit "$maestro_exit"
              fi
            fi
          else
            echo "No iOS Maestro tests found - skipping E2E tests"
          fi

      - name: Upload iOS device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: ios-device-diagnostics
          path: |
            /tmp/xcode-test.log
            /tmp/maestro-ios.log
            ${{ runner.temp }}/openclaw-ci-retry/
            ios/OpenClawConsole/.build/DerivedData/Logs/Test/
          if-no-files-found: ignore
