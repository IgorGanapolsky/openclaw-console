name: Security Pipeline
on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "openclaw-skills/package.json"
      - "openclaw-skills/package-lock.json"
      - ".claude/skills/teams-rag-connector/scripts/package.json"
      - ".claude/skills/teams-rag-connector/scripts/package-lock.json"
      - "android/**"
      - "ios/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/security.yml"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scope:
    name: Security Scope
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.scope.outputs.android_changed }}
      ios_changed: ${{ steps.scope.outputs.ios_changed }}
      all_languages: ${{ steps.scope.outputs.all_languages }}
      codeql_matrix: ${{ steps.scope.outputs.codeql_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed security surfaces
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "android_changed=true"
              echo "ios_changed=true"
              echo "all_languages=true"
              echo 'codeql_matrix=[{"language":"javascript-typescript","os":"ubuntu-latest"},{"language":"java-kotlin","os":"ubuntu-latest"},{"language":"swift","os":"macos-26"}]'
            } >> "$GITHUB_OUTPUT"
            echo "security-scope: full scan for ${{ github.event_name }}"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}"...HEAD > changed-files.txt
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt
          else
            git diff --name-only HEAD~1 HEAD > changed-files.txt
          fi

          cat changed-files.txt

          android_changed=false
          ios_changed=false
          all_languages=false

          if grep -Eq '^android/' changed-files.txt; then
            android_changed=true
          fi

          if grep -Eq '^(ios/|Package\.swift$|Package\.resolved$)' changed-files.txt; then
            ios_changed=true
          fi

          codeql_matrix='[{"language":"javascript-typescript","os":"ubuntu-latest"}'
          if [[ "$android_changed" == "true" ]]; then
            codeql_matrix="${codeql_matrix},{\"language\":\"java-kotlin\",\"os\":\"ubuntu-latest\"}"
          fi
          if [[ "$ios_changed" == "true" ]]; then
            codeql_matrix="${codeql_matrix},{\"language\":\"swift\",\"os\":\"macos-26\"}"
          fi
          codeql_matrix="${codeql_matrix}]"

          {
            echo "android_changed=$android_changed"
            echo "ios_changed=$ios_changed"
            echo "all_languages=$all_languages"
            echo "codeql_matrix=$codeql_matrix"
          } >> "$GITHUB_OUTPUT"

          echo "security-scope: android_changed=$android_changed ios_changed=$ios_changed all_languages=$all_languages codeql_matrix=$codeql_matrix"

  dependency-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "openclaw-skills/package-lock.json"

      - name: npm audit (OpenClaw skills)
        working-directory: openclaw-skills
        run: |
          npm ci
          npm audit --audit-level=high

      - name: npm audit (Teams RAG connector)
        working-directory: .claude/skills/teams-rag-connector/scripts
        run: |
          npm ci
          npm audit --audit-level=high

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    needs: security-scope
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.security-scope.outputs.codeql_matrix) }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@v4

      - name: Build Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Swift for CodeQL
        if: matrix.language == 'swift'
        working-directory: ios/OpenClawConsole
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' | head -n 1)
          if [ -n "$SIMULATOR_NAME" ]; then
            DESTINATION="platform=iOS Simulator,name=$SIMULATOR_NAME"
          else
            DESTINATION="generic/platform=iOS Simulator"
          fi
          echo "Using destination: $DESTINATION"
          xcodebuild build \
            -scheme OpenClawConsole \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Custom secret patterns
        run: |
          ERRORS=0
          for pattern in "AKIA[0-9A-Z]{16}" "ghp_[a-zA-Z0-9]{36}" "sk-[a-zA-Z0-9]{48}" "firebase.*api.*key"; do
            if grep -rn "$pattern" --include="*.swift" --include="*.kt" --include="*.ts" --include="*.json" \
               --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.git . 2>/dev/null; then
              echo "FAIL: Found potential secret matching pattern: $pattern"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS potential secret leak(s)"
            exit 1
          fi
          echo "No secrets detected"
