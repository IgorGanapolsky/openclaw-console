name: Internal Distribution

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to distribute (optional, defaults to develop)"
        required: false
        type: string

concurrency:
  group: internal-distribution-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate Internal Distribution
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      ref: ${{ steps.decide.outputs.ref }}
      sha: ${{ steps.decide.outputs.sha }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Decide whether to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          ALLOWED_BRANCHES: "develop main"
          INPUT_REF: ${{ inputs.ref }}
          DISTRIBUTION_PATH_REGEX: '^(android/|ios/|scripts/(preflight-release\.sh|sync_app_icons\.py|sync-android-launcher-icon\.sh|validate_release_contract\.py)|\.github/workflows/(internal-distribution|native-release|android|ios)\.yml$)'
        run: |
          set -euo pipefail

          SHOULD_RUN="false"
          REF=""
          SHA=""
          REASON="not_eligible"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REF="${INPUT_REF:-$GITHUB_REF_NAME}"
            SHOULD_RUN="true"
            REASON="manual_dispatch"
          elif [[ "$EVENT_NAME" == "workflow_run" && "$WORKFLOW_CONCLUSION" == "success" ]]; then
            if [[ " $ALLOWED_BRANCHES " != *" $WORKFLOW_BRANCH "* ]]; then
              REASON="branch_not_eligible_${WORKFLOW_BRANCH}"
              echo "gate: skipping internal distribution for branch=$WORKFLOW_BRANCH"
              {
                echo "should_run=$SHOULD_RUN"
                echo "ref=$REF"
                echo "sha=$SHA"
                echo "reason=$REASON"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            REF="$WORKFLOW_SHA"
            SHA="$WORKFLOW_SHA"

            if git rev-parse "${WORKFLOW_SHA}^" >/dev/null 2>&1; then
              CHANGED_FILES="$(git diff --name-only "${WORKFLOW_SHA}^" "$WORKFLOW_SHA")"
            else
              CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$WORKFLOW_SHA" || true)"
            fi

            if ! grep -Eq "$DISTRIBUTION_PATH_REGEX" <<< "$CHANGED_FILES"; then
              REASON="no_distribution_paths_changed"
              echo "gate: skipping internal distribution; changed files do not affect mobile release artifacts"
              printf '%s\n' "$CHANGED_FILES" | sed 's/^/gate: changed: /'
              {
                echo "should_run=$SHOULD_RUN"
                echo "ref=$REF"
                echo "sha=$SHA"
                echo "reason=$REASON"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            SHOULD_RUN="true"
            REASON="ci_green_on_${WORKFLOW_BRANCH}"
          fi

          {
            echo "should_run=$SHOULD_RUN"
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          echo "gate: should_run=$SHOULD_RUN reason=$REASON ref=$REF sha=$SHA"

  ios-testflight-internal:
    name: iOS TestFlight (Internal)
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ${{ fromJSON(vars.IOS_TESTFLIGHT_RUNS_ON || '"macos-26"') }}
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Setup Python
        if: runner.environment != 'self-hosted'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure self-hosted Python
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv-internal-distribution
          echo "$PWD/.venv-internal-distribution/bin" >> "$GITHUB_PATH"
          .venv-internal-distribution/bin/python -m pip install --upgrade pip
          .venv-internal-distribution/bin/python -m pip --version

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Install App Store Connect Python dependencies
        run: python3 -m pip install pyjwt==2.11.0 cryptography==46.0.5

      - name: Fail fast on required iOS distribution secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for name in MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION APPSTORE_PRIVATE_KEY APPSTORE_KEY_ID APPSTORE_ISSUER_ID ADMIN_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Preflight release checks (iOS)
        run: bash scripts/preflight-release.sh --platform ios --layer 1

      - name: Setup Ruby
        if: runner.environment != 'self-hosted'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios/OpenClawConsole

      - name: Setup Ruby (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          echo "/opt/homebrew/opt/ruby@3.2/bin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/ruby@3.2/bin/ruby --version
          /opt/homebrew/opt/ruby@3.2/bin/bundle install --jobs 4 --retry 3
        working-directory: ios/OpenClawConsole

      - name: Install Fastlane
        if: runner.environment != 'self-hosted'
        run: gem install fastlane
        working-directory: ios/OpenClawConsole

      - name: Verify Fastlane (self-hosted)
        if: runner.environment == 'self-hosted'
        run: bundle exec fastlane --version
        working-directory: ios/OpenClawConsole

      - name: Write App Store Connect key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Configure git credentials for match
        env:
          GIT_AUTH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global core.askpass ""
          git config --global credential.helper ""
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_GIT_BASIC_AUTHORIZATION" >> "$GITHUB_ENV"

      - name: Setup signing certificates and profiles (match)
        env:
          CI: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_DISABLE_COLORS: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_PATH: ${{ env.APPSTORE_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane setup
        working-directory: ios/OpenClawConsole

      - name: Archive IPA for TestFlight
        timeout-minutes: 60
        env:
          CI: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_DISABLE_COLORS: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_PATH: ${{ env.APPSTORE_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_INTERNAL_GROUPS || vars.TESTFLIGHT_GROUPS || secrets.TESTFLIGHT_GROUPS || 'App Store Connect Users' }}
          TESTFLIGHT_DISTRIBUTE_EXTERNAL: ${{ vars.TESTFLIGHT_DISTRIBUTE_EXTERNAL || 'false' }}
          TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: ${{ vars.TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS || 'false' }}
          TESTFLIGHT_SKIP_WAITING_FOR_BUILD_PROCESSING: "true"
          TESTFLIGHT_ARCHIVE_ONLY: "true"
        run: |
          set -Eeuo pipefail
          bundle exec fastlane beta --verbose 2>&1 | tee fastlane-archive.log
        working-directory: ios/OpenClawConsole

      - name: Upload archived IPA to TestFlight
        timeout-minutes: 45
        env:
          CI: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_DISABLE_COLORS: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_PATH: ${{ env.APPSTORE_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_INTERNAL_GROUPS || vars.TESTFLIGHT_GROUPS || secrets.TESTFLIGHT_GROUPS || 'App Store Connect Users' }}
          TESTFLIGHT_DISTRIBUTE_EXTERNAL: ${{ vars.TESTFLIGHT_DISTRIBUTE_EXTERNAL || 'false' }}
          TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: ${{ vars.TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS || 'false' }}
          TESTFLIGHT_SKIP_WAITING_FOR_BUILD_PROCESSING: "false"
          TESTFLIGHT_UPLOAD_ONLY: "true"
        run: |
          set -Eeuo pipefail
          bundle exec fastlane beta --verbose 2>&1 | tee fastlane-upload.log
        working-directory: ios/OpenClawConsole

      - name: Ensure TestFlight internal visibility
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_PATH: ${{ env.APPSTORE_KEY_PATH }}
          TESTFLIGHT_INTERNAL_GROUPS: ${{ vars.TESTFLIGHT_INTERNAL_GROUPS || vars.TESTFLIGHT_GROUPS || secrets.TESTFLIGHT_GROUPS || 'App Store Connect Users' }}
          TESTFLIGHT_REQUIRED_TESTERS: ${{ vars.TESTFLIGHT_INTERNAL_TESTERS || secrets.TESTFLIGHT_INTERNAL_TESTERS || '' }}
        run: |
          set -euo pipefail
          VERSION="$(cd ios/OpenClawConsole && xcodebuild -showBuildSettings -scheme OpenClawConsole 2>/dev/null | awk -F'= ' '/MARKETING_VERSION/ {print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "❌ Could not resolve iOS MARKETING_VERSION"
            exit 1
          fi
          python3 scripts/ensure_testflight_visibility.py \
            --version "$VERSION" \
            --groups "$TESTFLIGHT_INTERNAL_GROUPS" \
            --required-testers "$TESTFLIGHT_REQUIRED_TESTERS" \
            --assign-required-testers \
            --wait \
            --timeout 900 \
            --poll-interval 60

      - name: Collect iOS distribution logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ios/OpenClawConsole/build-logs/gym
          if [ -d "$HOME/Library/Logs/gym" ]; then
            cp -R "$HOME/Library/Logs/gym/." ios/OpenClawConsole/build-logs/gym/
          fi

      - name: Show iOS distribution log tail
        if: failure()
        run: |
          set -euo pipefail
          for log in ios/OpenClawConsole/fastlane-archive.log ios/OpenClawConsole/fastlane-upload.log; do
            if [ -f "$log" ]; then
              echo "===== tail $log ====="
              tail -n 200 "$log"
            fi
          done

      - name: Upload iOS distribution artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-distribution-internal
          path: |
            ios/OpenClawConsole/OpenClawConsole.ipa
            ios/OpenClawConsole/fastlane-archive.log
            ios/OpenClawConsole/fastlane-upload.log
            ios/OpenClawConsole/build-logs
          if-no-files-found: warn

  android-firebase-internal:
    name: Android Firebase App Distribution (Internal)
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Fail fast on Android distribution auth inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "❌ Missing required secret: GOOGLE_SERVICES_JSON"
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "❌ Missing required secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi

          # Explicit authentication precedence (2026 best practices)
          AUTH_METHOD=""
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            AUTH_METHOD="service_account_primary"
          elif [ -n "${GOOGLE_PLAY_JSON_KEY:-}" ]; then
            AUTH_METHOD="service_account_fallback"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            AUTH_METHOD="deprecated_token"
            echo "⚠️ WARNING: FIREBASE_TOKEN is deprecated. Use FIREBASE_SERVICE_ACCOUNT_JSON or GOOGLE_PLAY_JSON_KEY for reliable 2026 authentication."
          else
            echo "❌ Firebase authentication required. Set FIREBASE_SERVICE_ACCOUNT_JSON (preferred) or GOOGLE_PLAY_JSON_KEY (fallback) or FIREBASE_TOKEN (deprecated)."
            exit 1
          fi

          echo "✅ Firebase auth method: $AUTH_METHOD"

      - name: Preflight release checks (Android)
        run: bash scripts/preflight-release.sh --platform android --layer 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create google-services.json
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Resolve Firebase app id
        id: firebase
        working-directory: android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          APP_ID="$(jq -r '.client[0].client_info.mobilesdk_app_id // empty' app/google-services.json)"
          if [ -z "$APP_ID" ] && [ -n "${FIREBASE_ANDROID_APP_ID:-}" ]; then
            APP_ID="$FIREBASE_ANDROID_APP_ID"
          fi
          if [ -z "$APP_ID" ]; then
            echo "❌ Could not resolve Firebase Android app id. Set FIREBASE_ANDROID_APP_ID secret or include mobilesdk_app_id in GOOGLE_SERVICES_JSON."
            exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved Firebase app id: $APP_ID"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          # Use apksigner from Android SDK build-tools (available on ubuntu-latest via setup-java)
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "⚠️ apksigner not found via SDK path, trying PATH"
            APKSIGNER=$(command -v apksigner || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner not available — cannot verify APK signature"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          echo "✅ APK signature verified"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase auth credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail

          # Priority 1: FIREBASE_SERVICE_ACCOUNT_JSON (dedicated Firebase SA)
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            CREDENTIALS_FILE="${RUNNER_TEMP}/firebase-sa.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"
            echo "✅ Using FIREBASE_SERVICE_ACCOUNT_JSON for Firebase authentication"
          # Priority 2: GOOGLE_PLAY_JSON_KEY (fallback)
          elif [ -n "${GOOGLE_PLAY_JSON_KEY:-}" ]; then
            CREDENTIALS_FILE="${RUNNER_TEMP}/gcp-sa.json"
            printf '%s' "$GOOGLE_PLAY_JSON_KEY" > "$CREDENTIALS_FILE"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"
            echo "✅ Using GOOGLE_PLAY_JSON_KEY as fallback for Firebase authentication"
          fi

      - name: Distribute to internal Firebase tester(s)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_INTERNAL_TESTERS: ${{ vars.FIREBASE_INTERNAL_TESTERS }}
          FIREBASE_INTERNAL_GROUPS: ${{ vars.FIREBASE_INTERNAL_GROUPS }}
          FIREBASE_REQUIRED_TESTER_EMAIL: ${{ vars.FIREBASE_REQUIRED_TESTER_EMAIL }}
          FIREBASE_APP_ID: ${{ steps.firebase.outputs.app_id }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "❌ Firebase distribution failed at line $LINENO: $BASH_COMMAND (rc=$rc)"; exit $rc' ERR
          DIST_LOG="${RUNNER_TEMP}/firebase-distribute.log"
          echo "FIREBASE_DISTRIBUTION_LOG=$DIST_LOG" >> "$GITHUB_ENV"

          # Validate Firebase project configuration
          echo "🔍 Pre-flight Firebase project verification (project=$FIREBASE_PROJECT_ID)"
          # Extract project ID from google-services.json as authoritative source when secret unset
          RESOLVED_PROJECT_ID="${FIREBASE_PROJECT_ID}"
          if [ -z "$RESOLVED_PROJECT_ID" ] || [ "$RESOLVED_PROJECT_ID" = "openclaw-console-mobile" ]; then
            GS_PROJECT_ID="$(jq -r '.project_info.project_id // empty' android/app/google-services.json 2>/dev/null || true)"
            if [ -n "$GS_PROJECT_ID" ]; then
              echo "ℹ️ Resolving Firebase project ID from google-services.json: $GS_PROJECT_ID"
              RESOLVED_PROJECT_ID="$GS_PROJECT_ID"
            fi
          fi
          export FIREBASE_PROJECT_ID="$RESOLVED_PROJECT_ID"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

          # Validate Firebase project exists in accessible projects list (soft check — some
          # service accounts only have app-distribution role and cannot list projects).
          if firebase projects:list --json > /tmp/fb-projects.json 2>/dev/null; then
            if ! jq -e --arg pid "$FIREBASE_PROJECT_ID" '.result[] | select(.projectId == $pid)' /tmp/fb-projects.json > /dev/null; then
              echo "⚠️ Project $FIREBASE_PROJECT_ID not visible to this credential; continuing anyway (distribute will fail if truly inaccessible)"
            else
              echo "✅ Firebase project $FIREBASE_PROJECT_ID accessible"
            fi
          else
            echo "ℹ️ Could not list Firebase projects (credential may lack projects.get); continuing to distribute attempt"
          fi

          # Validate package name matches Firebase app
          echo "🔍 Validating package name consistency"
          BUILD_PACKAGE=$(grep -o 'applicationId = "[^"]*"' android/app/build.gradle.kts | sed 's/applicationId = "\(.*\)"/\1/')
          if [ "$BUILD_PACKAGE" != "com.openclaw.console" ]; then
            echo "❌ Package name mismatch: build.gradle.kts=$BUILD_PACKAGE expected=com.openclaw.console"
            exit 1
          fi

          # Determine authentication method with explicit precedence
          # IMPORTANT: Do NOT unset FIREBASE_TOKEN when using service account — we keep it
          # around so the retry loop below can fall back to token auth if the service
          # account lacks the required roles (firebaseappdistro.admin).
          AUTH_MODE=""
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]; then
            AUTH_MODE="service_account"
            echo "✅ Using service account authentication (2026 best practice)"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            AUTH_MODE="deprecated_token"
            echo "⚠️ WARNING: Using deprecated FIREBASE_TOKEN - may fail silently or not send emails"
          else
            echo "❌ No valid Firebase authentication found"
            exit 1
          fi

          # Prepare distribution command
          TESTERS="${FIREBASE_INTERNAL_TESTERS:-}"
          DIST_GROUPS="${FIREBASE_INTERNAL_GROUPS:-}"
          REQUIRED_TESTER="${FIREBASE_REQUIRED_TESTER_EMAIL:-}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          # Add required tester if specified
          if [ -n "$REQUIRED_TESTER" ]; then
            if [ -n "$TESTERS" ]; then
              # Check if already included
              if [[ ",$TESTERS," != *",$REQUIRED_TESTER,"* ]]; then
                TESTERS="$TESTERS,$REQUIRED_TESTER"
                echo "Added required Firebase tester: $REQUIRED_TESTER"
              fi
            else
              TESTERS="$REQUIRED_TESTER"
            fi
          fi

          # Build Firebase command
          BASE_CMD=(
            firebase appdistribution:distribute
            "$APK_PATH"
            --app "$FIREBASE_APP_ID"
            --project "$FIREBASE_PROJECT_ID"
            --release-notes "Internal auto-distribution from develop (${GITHUB_SHA})"
          )

          if [ "$AUTH_MODE" = "deprecated_token" ]; then
            BASE_CMD+=(--token "$FIREBASE_TOKEN")
          fi

          # Execute distribution with retry logic
          ATTEMPT=1
          MAX_ATTEMPTS=3
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ] && [ "$SUCCESS" = false ]; do
            echo "🚀 Firebase distribution attempt $ATTEMPT/$MAX_ATTEMPTS (auth=$AUTH_MODE)"
            : > "$DIST_LOG"

            DIST_CMD=("${BASE_CMD[@]}")
            if [ -n "$TESTERS" ] && [ -n "$DIST_GROUPS" ]; then
              DIST_CMD+=(--testers "$TESTERS" --groups "$DIST_GROUPS")
            elif [ -n "$TESTERS" ]; then
              DIST_CMD+=(--testers "$TESTERS")
            elif [ -n "$DIST_GROUPS" ]; then
              DIST_CMD+=(--groups "$DIST_GROUPS")
            fi

            if "${DIST_CMD[@]}" 2>&1 | tee "$DIST_LOG"; then
              SUCCESS=true
              echo "✅ Firebase distribution successful on attempt $ATTEMPT"
            else
              rc=$?
              echo "❌ Attempt $ATTEMPT failed with exit code $rc"
              
              # Fallback to token if permission error (403) and token is available
              if [ $rc -eq 1 ] && [ "$AUTH_MODE" = "service_account" ] && [ -n "${FIREBASE_TOKEN:-}" ]; then
                echo "⚠️ Detected potential permission error with service account. Attempting fallback to FIREBASE_TOKEN..."
                TOKEN_CMD=("${BASE_CMD[@]}" --token "$FIREBASE_TOKEN")
                if [ -n "$TESTERS" ] && [ -n "$DIST_GROUPS" ]; then
                  TOKEN_CMD+=(--testers "$TESTERS" --groups "$DIST_GROUPS")
                elif [ -n "$TESTERS" ]; then
                  TOKEN_CMD+=(--testers "$TESTERS")
                elif [ -n "$DIST_GROUPS" ]; then
                  TOKEN_CMD+=(--groups "$DIST_GROUPS")
                fi
                
                : > "$DIST_LOG"
                if "${TOKEN_CMD[@]}" 2>&1 | tee "$DIST_LOG"; then
                  SUCCESS=true
                  echo "✅ Firebase distribution successful via FIREBASE_TOKEN fallback"
                  break
                fi
              fi

              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "❌ All distribution attempts failed"
                exit 1
              fi
              ((ATTEMPT++))
              sleep 5
            fi
          done

      - name: Verify Firebase distribution actually worked
        run: |
          set -euo pipefail

          echo "🔍 Verifying Firebase distribution delivery"
          LOG_FILE="${FIREBASE_DISTRIBUTION_LOG:-${RUNNER_TEMP}/firebase-distribute.log}"

          if [ ! -s "$LOG_FILE" ]; then
            echo "❌ Firebase distribution log not found at $LOG_FILE"
            exit 1
          fi

          if ! grep -q "uploaded new release" "$LOG_FILE"; then
            echo "❌ Firebase CLI did not report a successful release upload"
            echo "Distribution log:"
            cat "$LOG_FILE"
            exit 1
          fi

          RELEASE_LINE=$(grep -m1 "uploaded new release" "$LOG_FILE" || true)
          CONSOLE_URL=$(grep -m1 "View this release in the Firebase console:" "$LOG_FILE" | sed 's/.*View this release in the Firebase console: //' || true)
          SHARE_URL=$(grep -m1 "Share this release with testers who have access:" "$LOG_FILE" | sed 's/.*Share this release with testers who have access: //' || true)

          echo "📱 $RELEASE_LINE"
          if [ -n "$CONSOLE_URL" ]; then
            echo "🔗 Firebase console: $CONSOLE_URL"
          else
            echo "⚠️ Firebase console URL was not present in CLI output"
          fi
          if [ -n "$SHARE_URL" ]; then
            echo "📧 Tester share URL: $SHARE_URL"
          else
            echo "⚠️ Tester share URL was not present in CLI output"
          fi

          echo "✅ Firebase App Distribution verification complete"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-apk-internal
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore
