name: iOS CI

on:
  pull_request:
    paths:
      - 'ios/**'
  push:
    branches: [main, develop]
    paths:
      - 'ios/**'

jobs:
  build-and-test:
    runs-on: ${{ vars.IOS_CI_RUNS_ON || 'macos-26' }}
    defaults:
      run:
        working-directory: ios/OpenClawConsole

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: runner.environment != 'self-hosted'
        run: |
          if [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          else
            echo "Xcode 15.2 not installed; using current Xcode: $(xcode-select -p)"
            xcodebuild -version
          fi

      - name: Install xcpretty
        run: command -v xcpretty >/dev/null 2>&1 || gem install xcpretty

      - name: Resolve simulator destination
        id: simulator
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' | head -n 1)
          if [ -n "$SIMULATOR_NAME" ]; then
            DESTINATION="platform=iOS Simulator,name=$SIMULATOR_NAME"
          else
            DESTINATION="generic/platform=iOS Simulator"
          fi
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
          echo "Using destination: $DESTINATION"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme OpenClawConsole -destination '${{ steps.simulator.outputs.destination }}'

      - name: Build
        run: |
          xcodebuild build \
            -scheme OpenClawConsole \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme OpenClawConsole \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  lint:
    runs-on: ${{ vars.IOS_CI_RUNS_ON || 'macos-26' }}
    defaults:
      run:
        working-directory: ios/OpenClawConsole

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
