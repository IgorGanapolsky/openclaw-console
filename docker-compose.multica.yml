# Docker Compose for OpenClaw + Multica Integration
# High-ROI deployment setup for combined orchestration platform

version: '3.8'

services:
  # Multica Backend (Go)
  multica-backend:
    image: multimodal/backend:latest
    container_name: openclaw-multica-backend
    environment:
      - DATABASE_URL=postgres://multica:${POSTGRES_PASSWORD}@multica-postgres:5432/multica
      - REDIS_URL=redis://multica-redis:6379
      - APP_ENVIRONMENT=production
      - API_PORT=8080
      - WEBHOOK_SECRET=${MULTICA_WEBHOOK_SECRET}
      # Email disabled for now - use development mode
      - RESEND_API_KEY=
      - AUTH_MODE=development
    ports:
      - "8080:8080"
    depends_on:
      - multica-postgres
      - multica-redis
    volumes:
      - multica-backend-data:/app/data
    restart: unless-stopped
    networks:
      - openclaw-multica

  # Multica Frontend (Next.js)
  multica-frontend:
    image: multimodal/frontend:latest
    container_name: openclaw-multica-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - multica-backend
    restart: unless-stopped
    networks:
      - openclaw-multica

  # Multica Database
  multica-postgres:
    image: postgres:15-alpine
    container_name: openclaw-multica-postgres
    environment:
      - POSTGRES_DB=multica
      - POSTGRES_USER=multica
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5432:5432"
    volumes:
      - multica-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multica-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - openclaw-multica

  # Multica Redis (for caching and sessions)
  multica-redis:
    image: redis:7-alpine
    container_name: openclaw-multica-redis
    ports:
      - "6379:6379"
    volumes:
      - multica-redis-data:/data
    restart: unless-stopped
    networks:
      - openclaw-multica

  # OpenClaw Gateway (existing service, now with Multica integration)
  openclaw-gateway:
    build:
      context: ./openclaw-skills
      dockerfile: Dockerfile
    container_name: openclaw-gateway
    environment:
      - NODE_ENV=production
      - PORT=18789
      - MULTICA_API_URL=http://multica-backend:8080
      - MULTICA_API_TOKEN=${MULTICA_API_TOKEN}
      - MULTICA_WEBHOOK_SECRET=${MULTICA_WEBHOOK_SECRET}
      - ENABLE_MULTICA_BRIDGE=true
      - OPENCLAW_DEV_TOKEN=${OPENCLAW_DEV_TOKEN}
    ports:
      - "18789:18789"
    depends_on:
      - multica-backend
    volumes:
      - ./openclaw-skills:/app
      - /var/run/docker.sock:/var/run/docker.sock # For container management
    restart: unless-stopped
    networks:
      - openclaw-multica

  # Nginx Reverse Proxy (optional, for production)
  nginx-proxy:
    image: nginx:alpine
    container_name: openclaw-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/openclaw-multica.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - openclaw-gateway
      - multica-frontend
      - multica-backend
    restart: unless-stopped
    networks:
      - openclaw-multica
    profiles:
      - production # Only start with --profile production

volumes:
  multica-postgres-data:
    driver: local
  multica-redis-data:
    driver: local
  multica-backend-data:
    driver: local

networks:
  openclaw-multica:
    driver: bridge
    name: openclaw-multica-network